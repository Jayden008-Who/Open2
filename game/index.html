<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Open Skies</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#05080f;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf2ff;
    user-select:none;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #hud.off{display:none}
  #compass{position:absolute;left:50%;top:12px;transform:translateX(-50%);
    font-size:12px;font-weight:700;letter-spacing:3px;opacity:.65;text-shadow:0 2px 6px #000}
  #found{position:absolute;left:16px;top:14px;font-size:12px;letter-spacing:1px;
    opacity:.55;text-shadow:0 2px 6px #000}
  #miniWrap{position:absolute;right:16px;top:14px;width:120px;height:120px;border-radius:50%;
    overflow:hidden;border:2px solid rgba(255,255,255,.22);background:#0a1420;opacity:.9}
  #mini{width:120px;height:120px;display:block}
  #toasts{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
    display:flex;flex-direction:column;align-items:center;gap:8px}
  .toast{padding:8px 18px;border-radius:30px;font-size:12px;font-weight:700;letter-spacing:1.5px;
    background:rgba(10,25,40,.82);border:1px solid rgba(140,225,255,.4);
    transition:opacity .6s,transform .6s}
  .toast.out{opacity:0;transform:translateY(-8px)}
  #joy{position:absolute;left:22px;bottom:26px;width:130px;height:130px;border-radius:50%;
    background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.18);
    opacity:.45;transition:opacity .2s}
  #joy.on{opacity:1}
  #knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;background:rgba(160,225,255,.5);border:2px solid rgba(255,255,255,.6)}
  #btns{position:absolute;right:20px;bottom:30px;display:flex;gap:14px;align-items:flex-end;pointer-events:auto}
  #topBtns{position:absolute;right:16px;top:142px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
  .btn{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;letter-spacing:.5px;
    background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.26);color:#fff}
  .btn:active{background:rgba(140,220,255,.35)}
  #jump{width:86px;height:86px}
  .small{width:44px;height:44px;font-size:10px}
  #overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:26px;
    background:radial-gradient(circle at 50% 35%,#16324f,#05080f 75%)}
  #overlay h1{font-size:32px;letter-spacing:5px;margin-bottom:12px}
  #overlay p{font-size:13px;opacity:.65;max-width:340px;line-height:1.7;margin-bottom:24px}
  #play{padding:15px 46px;border-radius:40px;font-size:15px;font-weight:800;letter-spacing:1.5px;
    background:#2ea8e0;color:#04121c;border:0}
  #overlay.hide{display:none}
  #loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:#05080f;font-size:13px;letter-spacing:2px;opacity:.8}
  #loading.hide{display:none}
</style>
</head>
<body>
<div id="loading">RAISING LAND…</div>
<div id="hud">
  <div id="compass">N</div>
  <div id="found">LANDMARKS 0/10</div>
  <div id="miniWrap"><canvas id="mini" width="150" height="150"></canvas></div>
  <div id="toasts"></div>
  <div id="joy"><div id="knob"></div></div>
  <div id="topBtns">
    <div class="btn small" id="hudBtn">HUD</div>
    <div class="btn small" id="tpBtn">HOME</div>
  </div>
  <div id="btns">
    <div class="btn" id="sprint">RUN</div>
    <div class="btn" id="jump">JUMP</div>
  </div>
</div>
<div id="overlay" class="hide">
  <h1>OPEN SKIES</h1>
  <p>No goal. No quest. Just an island and wherever you feel like going.<br><br>
  Left side walks · Right side looks · Hold JUMP while falling to glide · Map fills in as you explore</p>
  <button id="play">WANDER</button>
</div>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
var loadingEl=document.getElementById('loading');
function ensureThree(cb){
  if(window.THREE){cb();return;}
  var s=document.createElement('script');
  s.src='https://unpkg.com/three@0.128.0/build/three.min.js';
  s.onload=cb;
  s.onerror=function(){loadingEl.textContent='ENGINE FAILED TO LOAD';};
  document.head.appendChild(s);
}

var S=900,HALF=S/2,SEG=250,WATER=-0.6;
var clamp=function(v,a,b){return v<a?a:v>b?b:v;};

/* ---------- terrain ---------- */
function hash2(x,z){
  var n=x*374761393+z*668265263;
  n=(n^(n>>13))*1274126177;
  n=n^(n>>16);
  return ((n>>>0)%100000)/100000;
}
function vnoise(x,z){
  var xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  var u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  var a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function terrainHeight(x,z){
  var s=0.0028,h=0;
  h+=vnoise(x*s,z*s)*48;
  h+=vnoise(x*s*2.1+120,z*s*2.1+60)*17;
  h+=vnoise(x*s*5.3+400,z*s*5.3+900)*6;
  h-=27;
  var d=Math.sqrt(x*x+z*z)/HALF;
  if(d>0.6) h-=Math.pow(d-0.6,1.85)*300;
  return h;
}
function dryness(x,z){return vnoise(x*0.0016+5000,z*0.0016+5000);}
function biomeAt(x,z,h){
  if(h<1.0) return 'beach';
  if(h>36) return 'snow';
  if(h>26) return 'rock';
  var d=dryness(x,z);
  if(d>0.63) return 'desert';
  if(d<0.36) return 'forest';
  return 'grass';
}
function slopeAt(x,z){
  var h=terrainHeight(x,z);
  return Math.abs(terrainHeight(x+3,z)-h)+Math.abs(terrainHeight(x,z+3)-h);
}

ensureThree(function(){
'use strict';
var renderer,scene,camera,clock;
var player={x:0,y:0,z:0,vy:0,onGround:false};
var yaw=0,pitch=0,keys={},started=false;
var trees=[],sun,hemi,stars,water,t=0,found=0,gliding=false;
var jumpHeld=false,jumpReq=false,sprinting=false;
var spawn={x:0,z:0};

/* ---------- renderer ---------- */
renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene=new THREE.Scene();
var skyDay=new THREE.Color(0x93c4ea),skyNight=new THREE.Color(0x060c1c);
scene.background=skyDay.clone();
scene.fog=new THREE.Fog(0x93c4ea,90,460);

camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,900);
camera.rotation.order='YXZ';

hemi=new THREE.HemisphereLight(0xc6e6ff,0x2c3a26,0.5);
scene.add(hemi);
sun=new THREE.DirectionalLight(0xfff0d0,1.15);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-95;sun.shadow.camera.right=95;
sun.shadow.camera.top=95;sun.shadow.camera.bottom=-95;
sun.shadow.camera.far=400;
sun.shadow.bias=-0.0009;
scene.add(sun);scene.add(sun.target);

/* ---------- terrain mesh ---------- */
var geo=new THREE.PlaneGeometry(S,S,SEG,SEG);
geo.rotateX(-Math.PI/2);
var pos=geo.attributes.position,colors=[];
var sand=new THREE.Color(0xd8c79c),dune=new THREE.Color(0xc9a06a),
    grass=new THREE.Color(0x527f3c),forestC=new THREE.Color(0x35652f),
    rockC=new THREE.Color(0x716b63),snowC=new THREE.Color(0xe9eff3);
for(var i=0;i<pos.count;i++){
  var px=pos.getX(i),pz=pos.getZ(i);
  var h=terrainHeight(px,pz);
  pos.setY(i,h);
  var b=biomeAt(px,pz,h),c;
  if(b==='beach') c=sand.clone();
  else if(b==='desert') c=dune.clone().lerp(rockC,clamp((h-18)/14,0,1));
  else if(b==='forest') c=forestC.clone();
  else if(b==='grass') c=grass.clone();
  else if(b==='rock') c=rockC.clone().lerp(snowC,clamp((h-30)/12,0,1));
  else c=snowC.clone();
  var v=0.87+hash2(px*9,pz*9)*0.26;
  colors.push(c.r*v,c.g*v,c.b*v);
}
geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
geo.computeVertexNormals();
var terrain=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({
  vertexColors:true,roughness:0.97,metalness:0}));
terrain.receiveShadow=true;
scene.add(terrain);

/* ---------- water ---------- */
water=new THREE.Mesh(
  new THREE.PlaneGeometry(S*1.8,S*1.8,1,1),
  new THREE.MeshStandardMaterial({color:0x1e5f90,transparent:true,opacity:0.86,
    roughness:0.14,metalness:0.4}));
water.rotation.x=-Math.PI/2;
water.position.y=WATER;
scene.add(water);

/* ---------- stars ---------- */
var sg=new THREE.BufferGeometry(),sp=[];
for(var s2=0;s2<1600;s2++){
  var th=Math.random()*Math.PI*2,ph=Math.acos(Math.random()),r=620;
  sp.push(Math.sin(ph)*Math.cos(th)*r,Math.cos(ph)*r*0.9+60,Math.sin(ph)*Math.sin(th)*r);
}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
stars=new THREE.Points(sg,new THREE.PointsMaterial({
  color:0xffffff,size:2.2,transparent:true,opacity:0,depthWrite:false}));
scene.add(stars);

/* ---------- vegetation ---------- */
function place(count,minH,maxH,maxSlope,filter,fn){
  var n=0,guard=0;
  while(n<count&&guard<count*45){
    guard++;
    var a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*HALF*0.95;
    var x=Math.cos(a)*rr,z=Math.sin(a)*rr,h=terrainHeight(x,z);
    if(h<minH||h>maxH) continue;
    var b=biomeAt(x,z,h);
    if(filter&&!filter(b)) continue;
    if(slopeAt(x,z)>maxSlope) continue;
    fn(x,z,h,b);n++;
  }
}
var m4=new THREE.Matrix4(),q=new THREE.Quaternion(),v3=new THREE.Vector3(),sc=new THREE.Vector3();
var UP=new THREE.Vector3(0,1,0);

function buildInstanced(geoM,mat,list){
  var im=new THREE.InstancedMesh(geoM,mat,Math.max(list.length,1));
  im.castShadow=true;im.receiveShadow=true;
  list.forEach(function(o,idx){
    q.setFromAxisAngle(UP,o.rot);
    v3.set(o.x,o.y,o.z);sc.set(o.s,o.s*o.sy,o.s);
    m4.compose(v3,q,sc);
    im.setMatrixAt(idx,m4);
  });
  scene.add(im);
  return im;
}

var pines=[],birches=[],cacti=[],rocks=[],bushes=[];
place(760,1.4,33,2.4,function(b){return b==='forest'||b==='grass';},
  function(x,z,h,b){
    var o={x:x,z:z,y:h,rot:Math.random()*6.3,s:0.7+Math.random()*0.7,sy:0.8+Math.random()*0.6};
    trees.push({x:x,z:z,r:1.0});
    if(b==='forest'||Math.random()<0.45) pines.push(o); else birches.push(o);
  });
place(170,1.2,26,2.0,function(b){return b==='desert';},
  function(x,z,h){
    cacti.push({x:x,z:z,y:h,rot:Math.random()*6.3,s:0.8+Math.random()*0.6,sy:0.8+Math.random()*0.7});
    trees.push({x:x,z:z,r:0.7});
  });
place(430,0.4,34,3.2,null,function(x,z,h){rocks.push({x:x,z:z,y:h,rot:Math.random()*6.3,s:0.5+Math.random()*1.8,sy:0.7});});
place(520,1.2,30,2.6,function(b){return b!=='snow';},
  function(x,z,h){bushes.push({x:x,z:z,y:h,rot:Math.random()*6.3,s:0.7+Math.random()*0.7,sy:0.7});});

var trunkG=new THREE.CylinderGeometry(0.32,0.55,5,5);trunkG.translate(0,2.5,0);
var pineG=new THREE.ConeGeometry(2.4,8,6);pineG.translate(0,8.5,0);
var birchG=new THREE.IcosahedronGeometry(2.6,0);birchG.translate(0,7.4,0);
var cactusG=new THREE.CylinderGeometry(0.55,0.62,5.5,7);cactusG.translate(0,2.75,0);

buildInstanced(trunkG,new THREE.MeshStandardMaterial({color:0x5a4029,roughness:1}),pines.concat(birches));
buildInstanced(pineG,new THREE.MeshStandardMaterial({color:0x2c5a2a,roughness:1,flatShading:true}),pines);
buildInstanced(birchG,new THREE.MeshStandardMaterial({color:0x5c8a3e,roughness:1,flatShading:true}),birches);
buildInstanced(cactusG,new THREE.MeshStandardMaterial({color:0x4e7a45,roughness:1,flatShading:true}),cacti);
buildInstanced(new THREE.IcosahedronGeometry(1.5,0),
  new THREE.MeshStandardMaterial({color:0x7b756d,roughness:1,flatShading:true}),rocks);
buildInstanced(new THREE.IcosahedronGeometry(0.9,0),
  new THREE.MeshStandardMaterial({color:0x3f6b33,roughness:1,flatShading:true}),bushes);

/* ---------- landmarks ---------- */
var stoneMat=new THREE.MeshStandardMaterial({color:0x8b857c,roughness:1,flatShading:true});
var woodMat=new THREE.MeshStandardMaterial({color:0x6b4d30,roughness:1});
var glowMat=new THREE.MeshStandardMaterial({color:0x9fe9ff,emissive:0x2fb9e8,
  emissiveIntensity:2,roughness:0.3});
var paleMat=new THREE.MeshStandardMaterial({color:0xe6e2da,roughness:0.9});

var TYPES=[
 {name:'Standing Stones',build:function(g){
   for(var i=0;i<9;i++){
     var a=i/9*Math.PI*2,r=8+Math.random()*1.6;
     var m=new THREE.Mesh(new THREE.BoxGeometry(1.7,6+Math.random()*4.5,1.2),stoneMat);
     m.position.set(Math.cos(a)*r,3,Math.sin(a)*r);
     m.rotation.y=a;m.rotation.z=(Math.random()-0.5)*0.16;
     m.castShadow=m.receiveShadow=true;g.add(m);
   }}},
 {name:'Old Arch',build:function(g){
   [-3.4,3.4].forEach(function(x){
     var p=new THREE.Mesh(new THREE.BoxGeometry(1.6,7.5,1.6),stoneMat);
     p.position.set(x,3.75,0);p.castShadow=true;g.add(p);
   });
   var l=new THREE.Mesh(new THREE.BoxGeometry(9,1.4,1.6),stoneMat);
   l.position.set(0,7.9,0);l.castShadow=true;g.add(l);}},
 {name:'Lighthouse',build:function(g){
   var tw=new THREE.Mesh(new THREE.CylinderGeometry(1.5,2.8,22,10),paleMat);
   tw.position.y=11;tw.castShadow=true;g.add(tw);
   var lamp=new THREE.Mesh(new THREE.BoxGeometry(2.3,2.1,2.3),glowMat);
   lamp.position.y=23;g.add(lamp);
   var cap=new THREE.Mesh(new THREE.ConeGeometry(2.5,2.2,10),
     new THREE.MeshStandardMaterial({color:0x3a414a,roughness:0.8}));
   cap.position.y=25.1;g.add(cap);}},
 {name:'The Spire',build:function(g){
   var m=new THREE.Mesh(new THREE.ConeGeometry(4.5,38,7),stoneMat);
   m.position.y=19;m.castShadow=true;g.add(m);}},
 {name:'Hot Spring',build:function(g){
   for(var i=0;i<15;i++){
     var a=i/15*Math.PI*2;
     var r=new THREE.Mesh(new THREE.IcosahedronGeometry(0.95,0),stoneMat);
     r.position.set(Math.cos(a)*5.8,0.3,Math.sin(a)*5.8);
     r.scale.setScalar(0.8+Math.random()*0.7);r.castShadow=true;g.add(r);
   }
   var w=new THREE.Mesh(new THREE.CircleGeometry(5.2,26),glowMat);
   w.rotation.x=-Math.PI/2;w.position.y=0.14;g.add(w);}},
 {name:'Watchtower',build:function(g){
   [[-2.2,-2.2],[2.2,-2.2],[-2.2,2.2],[2.2,2.2]].forEach(function(p){
     var l=new THREE.Mesh(new THREE.BoxGeometry(0.7,11,0.7),woodMat);
     l.position.set(p[0],5.5,p[1]);l.castShadow=true;g.add(l);
   });
   var d=new THREE.Mesh(new THREE.BoxGeometry(6,0.5,6),woodMat);
   d.position.y=11;d.castShadow=true;g.add(d);
   var rail=new THREE.Mesh(new THREE.BoxGeometry(6,1.1,0.3),woodMat);
   rail.position.set(0,11.8,3);g.add(rail);
   var rail2=rail.clone();rail2.position.z=-3;g.add(rail2);}},
 {name:'Cairn Field',build:function(g){
   for(var k=0;k<6;k++){
     var bx=(Math.random()-0.5)*16,bz=(Math.random()-0.5)*16,hh=0;
     for(var s3=0;s3<5;s3++){
       var sz=0.9-s3*0.13;
       var st=new THREE.Mesh(new THREE.IcosahedronGeometry(sz,0),stoneMat);
       st.position.set(bx,hh+sz*0.6,bz);st.castShadow=true;g.add(st);
       hh+=sz*1.1;
     }
   }}},
 {name:'Abandoned Cabin',build:function(g){
   var box=new THREE.Mesh(new THREE.BoxGeometry(6,3.4,5),woodMat);
   box.position.y=1.7;box.castShadow=box.receiveShadow=true;g.add(box);
   var roof=new THREE.Mesh(new THREE.ConeGeometry(5.2,2.4,4),
     new THREE.MeshStandardMaterial({color:0x4a3a2a,roughness:1}));
   roof.position.y=4.6;roof.rotation.y=Math.PI/4;roof.castShadow=true;g.add(roof);
   var door=new THREE.Mesh(new THREE.BoxGeometry(1.2,2.1,0.2),
     new THREE.MeshStandardMaterial({color:0x2c2119}));
   door.position.set(0,1.05,2.55);g.add(door);}},
 {name:'Dead Giant',build:function(g){
   var tr=new THREE.Mesh(new THREE.CylinderGeometry(1.3,2.2,20,8),
     new THREE.MeshStandardMaterial({color:0x8a8072,roughness:1,flatShading:true}));
   tr.position.y=10;tr.rotation.z=0.22;tr.castShadow=true;g.add(tr);
   for(var b2=0;b2<6;b2++){
     var br=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.6,7,5),stoneMat);
     br.position.set((Math.random()-0.5)*2,13+b2*1.1,(Math.random()-0.5)*2);
     br.rotation.set(Math.random()*1.2,Math.random()*3,Math.random()*1.2);
     br.castShadow=true;g.add(br);
   }}},
 {name:'Broken Wall',build:function(g){
   for(var w2=0;w2<11;w2++){
     if(Math.random()<0.25) continue;
     var hh2=2+Math.random()*4;
     var seg=new THREE.Mesh(new THREE.BoxGeometry(2.4,hh2,1.3),stoneMat);
     seg.position.set(w2*2.6-13,hh2/2,0);seg.castShadow=true;g.add(seg);
   }}}
];

var landmarks=[],usedSpots=[];
TYPES.forEach(function(type){
  var tries=0,spot=null;
  while(tries<900&&!spot){
    tries++;
    var a=Math.random()*Math.PI*2,rr=Math.sqrt(Math.random())*HALF*0.72;
    var x=Math.cos(a)*rr,z=Math.sin(a)*rr,h=terrainHeight(x,z);
    if(h<2||h>27) continue;
    if(slopeAt(x,z)>2.6) continue;
    if(Math.sqrt(x*x+z*z)<70) continue;
    var ok=true;
    for(var u=0;u<usedSpots.length;u++){
      if(Math.hypot(usedSpots[u].x-x,usedSpots[u].z-z)<105){ok=false;break;}
    }
    if(!ok) continue;
    spot={x:x,z:z,y:h};
  }
  if(!spot) return;
  usedSpots.push(spot);
  var g=new THREE.Group();
  g.position.set(spot.x,spot.y,spot.z);
  g.rotation.y=Math.random()*6.3;
  type.build(g);
  scene.add(g);
  landmarks.push({x:spot.x,z:spot.z,name:type.name,found:false});
});

/* ---------- audio ---------- */
var actx=null;
function audioInit(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function tone(freq,dur,vol){
  try{
    if(!actx) return;
    var o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.14,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}
var windGain=null;
function startWind(){
  try{
    if(!actx||windGain) return;
    var len=actx.sampleRate*3;
    var buf=actx.createBuffer(1,len,actx.sampleRate);
    var dat=buf.getChannelData(0);
    for(var i3=0;i3<len;i3++) dat[i3]=(Math.random()*2-1)*0.35;
    var src=actx.createBufferSource();
    src.buffer=buf;src.loop=true;
    var filt=actx.createBiquadFilter();
    filt.type='lowpass';filt.frequency.value=520;
    windGain=actx.createGain();windGain.gain.value=0.045;
    src.connect(filt);filt.connect(windGain);windGain.connect(actx.destination);
    src.start();
  }catch(e){}
}

/* ---------- minimap ---------- */
var MAP=512,mapBase=document.createElement('canvas'),mapReveal=document.createElement('canvas');
mapBase.width=mapBase.height=MAP;mapReveal.width=mapReveal.height=MAP;
(function bakeMap(){
  var c=mapBase.getContext('2d');
  c.fillStyle='#0a1420';c.fillRect(0,0,MAP,MAP);
  var step=3;
  for(var y=0;y<MAP;y+=step){
    for(var x=0;x<MAP;x+=step){
      var wx=(x/MAP-0.5)*S, wz=(y/MAP-0.5)*S;
      var h=terrainHeight(wx,wz);
      if(h<WATER) c.fillStyle='#123a58';
      else{
        var b=biomeAt(wx,wz,h);
        if(b==='beach') c.fillStyle='#c2b189';
        else if(b==='desert') c.fillStyle='#b58f5c';
        else if(b==='forest') c.fillStyle='#2c5028';
        else if(b==='grass') c.fillStyle='#456b34';
        else if(b==='rock') c.fillStyle='#5f5a54';
        else c.fillStyle='#cdd6dc';
      }
      c.fillRect(x,y,step,step);
    }
  }
})();
var miniEl=document.getElementById('mini'),miniCtx=miniEl.getContext('2d');
var worldToMap=function(v){return (v/S+0.5)*MAP;};
function reveal(x,z){
  var c=mapReveal.getContext('2d');
  var mx=worldToMap(x),my=worldToMap(z),rad=42;
  c.save();
  c.beginPath();c.arc(mx,my,rad,0,6.2832);c.clip();
  c.drawImage(mapBase,0,0);
  c.restore();
}
var lastReveal=0;
function drawMini(){
  var cx=75,cy=75,zoom=MAP/210;
  miniCtx.fillStyle='#08111a';miniCtx.fillRect(0,0,150,150);
  miniCtx.save();
  miniCtx.beginPath();miniCtx.arc(cx,cy,72,0,6.2832);miniCtx.clip();
  miniCtx.drawImage(mapReveal,
    cx-worldToMap(player.x)*zoom, cy-worldToMap(player.z)*zoom,
    MAP*zoom,MAP*zoom);
  landmarks.forEach(function(l){
    if(!l.found) return;
    miniCtx.fillStyle='#8fe3ff';
    miniCtx.beginPath();
    miniCtx.arc(cx+(l.x-player.x)*zoom,cy+(l.z-player.z)*zoom,2.6,0,6.2832);
    miniCtx.fill();
  });
  miniCtx.restore();
  miniCtx.save();
  miniCtx.translate(cx,cy);miniCtx.rotate(-yaw);
  miniCtx.fillStyle='#ffffff';
  miniCtx.beginPath();miniCtx.moveTo(0,-7);miniCtx.lineTo(5,6);miniCtx.lineTo(0,3);
  miniCtx.lineTo(-5,6);miniCtx.closePath();miniCtx.fill();
  miniCtx.restore();
}

/* ---------- input ---------- */
var joy={id:null,ox:0,oy:0,dx:0,dy:0};
var look={id:null,lx:0,ly:0};
var joyEl=document.getElementById('joy'),knob=document.getElementById('knob');

document.addEventListener('touchstart',function(e){
  for(var i4=0;i4<e.changedTouches.length;i4++){
    var tt=e.changedTouches[i4];
    if(tt.clientX<window.innerWidth*0.45&&joy.id===null){
      joy.id=tt.identifier;joy.ox=tt.clientX;joy.oy=tt.clientY;
      joyEl.classList.add('on');knob.style.transform='translate(0,0)';
    }else if(look.id===null){
      look.id=tt.identifier;look.lx=tt.clientX;look.ly=tt.clientY;
    }
  }
  e.preventDefault();
},{passive:false});

document.addEventListener('touchmove',function(e){
  for(var i5=0;i5<e.changedTouches.length;i5++){
    var tt=e.changedTouches[i5];
    if(tt.identifier===joy.id){
      var dx=tt.clientX-joy.ox,dy=tt.clientY-joy.oy;
      var len=Math.sqrt(dx*dx+dy*dy),max=52;
      if(len>max){dx*=max/len;dy*=max/len;}
      joy.dx=dx/max;joy.dy=dy/max;
      knob.style.transform='translate('+dx+'px,'+dy+'px)';
    }else if(tt.identifier===look.id){
      yaw-=(tt.clientX-look.lx)*0.0044;
      pitch=clamp(pitch-(tt.clientY-look.ly)*0.0044,-1.5,1.5);
      look.lx=tt.clientX;look.ly=tt.clientY;
    }
  }
  e.preventDefault();
},{passive:false});

function endTouch(e){
  for(var i6=0;i6<e.changedTouches.length;i6++){
    var tt=e.changedTouches[i6];
    if(tt.identifier===joy.id){joy.id=null;joy.dx=0;joy.dy=0;
      joyEl.classList.remove('on');knob.style.transform='translate(0,0)';}
    if(tt.identifier===look.id) look.id=null;
  }
}
document.addEventListener('touchend',endTouch);
document.addEventListener('touchcancel',endTouch);

function bind(el,down,up){
  el.addEventListener('touchstart',function(e){e.stopPropagation();down();},{passive:true});
  el.addEventListener('touchend',function(e){e.stopPropagation();if(up)up();},{passive:true});
  el.addEventListener('touchcancel',function(){if(up)up();});
}
bind(document.getElementById('sprint'),function(){sprinting=true;},function(){sprinting=false;});
bind(document.getElementById('jump'),function(){jumpHeld=true;jumpReq=true;},function(){jumpHeld=false;});
document.getElementById('tpBtn').addEventListener('click',function(){
  player.x=spawn.x;player.z=spawn.z;player.vy=0;
  player.y=Math.max(terrainHeight(spawn.x,spawn.z),WATER)+0.3;
  tone(440,0.12);
});
document.getElementById('hudBtn').addEventListener('click',function(){
  document.getElementById('hud').classList.toggle('off');
});

window.addEventListener('keydown',function(e){
  keys[e.code]=true;
  if(e.code==='Space'){jumpHeld=true;jumpReq=true;}
  if(e.code==='KeyH') document.getElementById('hud').classList.toggle('off');
  if(e.code==='KeyT') document.getElementById('tpBtn').click();
});
window.addEventListener('keyup',function(e){
  keys[e.code]=false;
  if(e.code==='Space') jumpHeld=false;
});
document.addEventListener('mousedown',function(){
  if(started&&document.pointerLockElement!==renderer.domElement)
    renderer.domElement.requestPointerLock();
});
document.addEventListener('mousemove',function(e){
  if(document.pointerLockElement===renderer.domElement){
    yaw-=e.movementX*0.0022;
    pitch=clamp(pitch-e.movementY*0.0022,-1.5,1.5);
  }
});
window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

/* ---------- HUD bits ---------- */
var compassEl=document.getElementById('compass'),
    foundEl=document.getElementById('found'),
    toastBox=document.getElementById('toasts'),
    overlay=document.getElementById('overlay');
var DIRS=['N','NE','E','SE','S','SW','W','NW'];

function toast(txt){
  var el=document.createElement('div');
  el.className='toast';el.textContent=txt;
  toastBox.appendChild(el);
  setTimeout(function(){el.classList.add('out');},2300);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},3100);
}

document.getElementById('play').addEventListener('click',function(){
  overlay.classList.add('hide');
  started=true;
  audioInit();startWind();
  if(!('ontouchstart' in window)&&renderer.domElement.requestPointerLock)
    renderer.domElement.requestPointerLock();
  tone(560,0.14);
});

/* ---------- spawn ---------- */
(function findSpawn(){
  for(var n=0;n<400;n++){
    var a=Math.random()*6.2832,rr=Math.random()*90;
    var x=Math.cos(a)*rr,z=Math.sin(a)*rr;
    var h=terrainHeight(x,z);
    if(h>1.5&&h<24&&slopeAt(x,z)<2.2){spawn.x=x;spawn.z=z;return;}
  }
})();
player.x=spawn.x;player.z=spawn.z;
player.y=Math.max(terrainHeight(spawn.x,spawn.z),WATER)+0.3;

/* ---------- loop ---------- */
function update(dt){
  t+=dt;

  var ang=t*0.021+1.2;
  var day=clamp(Math.sin(ang)*1.7+0.4,0,1);
  sun.position.set(player.x+Math.cos(ang)*150,player.y+Math.sin(ang)*150+10,player.z+80);
  sun.target.position.set(player.x,player.y,player.z);
  sun.intensity=1.3*day;
  sun.color.setHSL(0.09,0.55*day,0.5+0.3*day);
  hemi.intensity=0.16+0.6*day;
  var sky=skyNight.clone().lerp(skyDay,day);
  scene.background.copy(sky);
  scene.fog.color.copy(sky);
  scene.fog.near=90-40*day;
  scene.fog.far=460-190*(1-day);
  stars.material.opacity=(1-day)*0.9;
  water.position.y=WATER+Math.sin(t*0.6)*0.05;

  var mx=0,mz=0;
  if(keys.KeyW||keys.ArrowUp) mz-=1;
  if(keys.KeyS||keys.ArrowDown) mz+=1;
  if(keys.KeyA||keys.ArrowLeft) mx-=1;
  if(keys.KeyD||keys.ArrowRight) mx+=1;
  mx+=joy.dx;mz+=joy.dy;
  var mlen=Math.sqrt(mx*mx+mz*mz);
  if(mlen>1){mx/=mlen;mz/=mlen;}

  var ground=terrainHeight(player.x,player.z);
  var swimming=ground<WATER-0.4;

  var sinY=Math.sin(yaw),cosY=Math.cos(yaw);
  var wx=mx*cosY-mz*sinY, wz=mx*sinY+mz*cosY;

  var speed=(sprinting||keys.ShiftLeft?11:6.4);
  if(swimming) speed*=0.5;
  if(gliding) speed*=1.5;

  if(player.onGround&&mlen>0.1){
    var ahead=terrainHeight(player.x+wx*1.6,player.z+wz*1.6);
    var rise=ahead-ground;
    if(rise>1.5) speed*=0.32;
    else if(rise>0.8) speed*=0.6;
  }

  player.x+=wx*speed*dt;
  player.z+=wz*speed*dt;
  player.x=clamp(player.x,-HALF+14,HALF-14);
  player.z=clamp(player.z,-HALF+14,HALF-14);

  for(var i7=0;i7<trees.length;i7++){
    var o=trees[i7];
    var ddx=player.x-o.x,ddz=player.z-o.z;
    var rr=o.r*0.5+0.5;
    var d2=ddx*ddx+ddz*ddz;
    if(d2<rr*rr&&d2>0.0001){
      var d3=Math.sqrt(d2);
      player.x=o.x+ddx/d3*rr;
      player.z=o.z+ddz/d3*rr;
    }
  }

  ground=terrainHeight(player.x,player.z);
  swimming=ground<WATER-0.4;

  if(jumpReq&&player.onGround){
    player.vy=8.6;player.onGround=false;tone(300,0.09,0.08);
  }
  jumpReq=false;

  gliding=false;
  if(!player.onGround&&player.vy<-1.2&&jumpHeld&&!swimming){
    gliding=true;
    player.vy=Math.max(player.vy,-2.4);
  }

  player.vy-=24*dt;
  player.y+=player.vy*dt;

  var floorY=swimming?WATER-0.35:ground;
  if(player.y<=floorY){
    player.y=floorY;player.vy=0;player.onGround=true;
  }else if(player.y>floorY+0.1){
    player.onGround=false;
  }

  camera.position.set(player.x,player.y+1.68,player.z);
  camera.rotation.set(pitch,yaw,0);

  var deg=((-yaw*180/Math.PI)%360+360)%360;
  compassEl.textContent=DIRS[Math.round(deg/45)%8]+'  '+Math.round(deg)+'°';

  for(var i8=0;i8<landmarks.length;i8++){
    var l=landmarks[i8];
    if(l.found) continue;
    if(Math.hypot(l.x-player.x,l.z-player.z)<24){
      l.found=true;found++;
      foundEl.textContent='LANDMARKS '+found+'/'+landmarks.length;
      toast(l.name.toUpperCase()+'  ·  DISCOVERED');
      tone(660,0.16,0.12);
      setTimeout(function(){tone(880,0.2,0.1);},120);
    }
  }

  lastReveal+=dt;
  if(lastReveal>0.22){lastReveal=0;reveal(player.x,player.z);}
  drawMini();
}

clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),0.05);
  if(started) update(dt);
  else{
    camera.position.set(player.x+Math.sin(t*0.1)*12,player.y+7,player.z+Math.cos(t*0.1)*12);
    camera.lookAt(player.x,player.y+1.5,player.z);
    t+=dt;
  }
  renderer.render(scene,camera);
}

reveal(player.x,player.z);
loadingEl.classList.add('hide');
overlay.classList.remove('hide');
loop();
});
})();
</script>
